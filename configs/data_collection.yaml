# Data Collection Configuration for PBL Project

# Sensor settings
ina219:
  i2c_bus: 1          # I2C bus number (typically 1 on Raspberry Pi)
  i2c_address: 0x40   # INA219 I2C address (0x40 or 0x41)

ds18b20:
  sensor_id: null     # Specific sensor ID (null = use first found)

# Data collection settings
collection:
  interval_seconds: 1.0           # Time between samples in seconds
  duration_seconds: 0             # Collection duration (0 = indefinite)
  experiment_id: "default_experiment"  # Default experiment identifier

# Data logging settings
logging:
  data_dir: "/home/bates/PBL/data/raw"    # Directory for CSV files
  filename_prefix: "sensor_data"          # Prefix for CSV filenames
  auto_save_interval: 10                  # Number of readings between buffer flushes

# Display settings (optional)
oled:
  width: 128                    # Display width in pixels
  height: 64                    # Display height in pixels
  i2c_address: 0x3C             # OLED I2C address

# Validation settings
validation:
  min_voltage: 0.0              # Minimum expected voltage (V)
  max_voltage: 26.0             # Maximum expected voltage (V) - INA219 limit
  min_current: -5.0             # Minimum expected current (A)
  max_current: 5.0              # Maximum expected current (A)
  min_temperature: -55.0        # Minimum expected temperature (°C)
  max_temperature: 125.0        # Maximum expected temperature (°C)